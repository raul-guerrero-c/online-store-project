# backend/search-service/src/main/resources/application.yml

server:
  port: 8083

spring:
  application:
    name: search-service

  datasource:
    url: jdbc:mysql://127.0.0.1:3306/online_store?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: DeveloperUnir  # Ajusta según tu usuario de MySQL
    password: DeveloperUnir  # <-- CAMBIAR por tu contraseña real

  jpa:
    hibernate:
      ddl-auto: none    # Muy importante: la BD ya está creada manualmente
    show-sql: true
    properties:
      hibernate:
        format_sql: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

logging:
  level:
    org.springframework.web: INFO
