server:
  port: 8083

spring:
  application:
    name: search-service

  datasource:
    url: jdbc:mysql://mysql:3306/online_store?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: DeveloperUnir
    password: DeveloperUnir

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
