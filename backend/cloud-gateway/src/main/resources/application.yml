# backend/cloud-gateway/src/main/resources/application.yml

server:
  port: 8081

spring:
  application:
    name: cloud-gateway

  cloud:
    discovery:
      locator:
        enabled: true
        lower-case-service-id: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
